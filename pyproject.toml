# pyproject.toml - Python's own file for vit-compare.
#
# It pins the toolchain. `recipe.ps1 test` runs pytest, mypy, ruff check and ruff
# format, and every setting those four read is here. There are no task-runner
# sections: the recipe's verbs are the tasks.

[build-system]
# Pinned with a version, not a bare name: an unpinned backend changes what
# `recipe.ps1 build` produces without anyone editing this file.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-compare"
# This must equal $Version in recipe.ps1: `recipe.ps1 test` fails when they disagree. It starts
# above the v1.0.0 tag the repository already carries.
version = "1.1.0"
description = "Console scripts that fine-tune three Vision Transformers and ConvNext on CIFAR-10 and compare their training time and inference latency."
readme = "README.md"
license = "MIT"
authors = [{ name = "Igors Volohovs" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    # What requirements.txt named before the lab, now pinned. torch and torchvision are held
    # to one pair; PyPI's Windows wheels of torch are the CPU build, so the runner never
    # fetches a CUDA stack.
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.5.4",
    "pillow==12.2.0",
    "rich==15.0.0",
]

[dependency-groups]
# `uv run` installs this group by default, so test.yaml's Runner health step finds
# ruff, pytest and mypy through `uv run --frozen <tool> --version`.
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
    "coverage==7.15.2",
]

[tool.setuptools]
py-modules = ["compare_vit_train", "inference_compare", "inference_convnext", "task1_convnext_train"]

[tool.uv]
# The tests and `recipe.ps1 run` use the source tree, so uv does not install the project.
package = false

[tool.ruff]
# Ruff refuses to run at all when its own version is not this one.
required-version = "0.16.1"
target-version = "py313"
line-length = 100
# Vendored agent tooling is not this project's code. Section 7 prints .claude/,
# tests/manual/serve.py and tools/wiki.py verbatim, so neither the linter nor the
# formatter may touch them.
extend-exclude = [".agent", ".claude", ".vscode", "tests/manual/serve.py", "tools/wiki.py"]

[tool.ruff.lint]
# BLE because each script marks its one broad boundary handler with `noqa: BLE001`.
select = ["E", "W", "F", "I", "UP", "B", "BLE", "SIM", "C90", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "C90"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
# The floor is the whole number below the 97.41% the suite measures on adoption. What is
# not covered is each script's `if __name__ == "__main__"` line and the CUDA-only cache flush.
addopts = "-q --strict-markers --cov --cov-report=term --cov-fail-under=97"

[tool.coverage.run]
# The four scripts are this repository's own code; nothing of them is omitted.
source = ["."]
branch = true
omit = ["tests/*", "tools/*", ".agent/*", ".claude/*", ".venv/*", "build/*", "dist/*"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.13"
files = ["compare_vit_train.py", "inference_compare.py", "inference_convnext.py", "task1_convnext_train.py", "tools"]
strict = true
# THE SILENCE LIST, measured on adoption: it only ever gets shorter (R-12). It is empty: the
# scripts already mark their untyped torchvision imports and from_pretrained calls inline.
